<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minerva">
  <!-- self-contained: paper tile so it reads on light or dark browser tabs -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#F5F6F4"/>
  <!-- register / aperture mark: ink frame -->
  <rect x="8" y="8" width="16" height="16" rx="3.5" fill="none" stroke="#1B1E20" stroke-width="3"/>
  <!-- single mineral signal tick, top-right -->
  <rect x="17.5" y="6.5" width="6" height="6" rx="1.6" fill="#2F5A5C"/>
</svg>
