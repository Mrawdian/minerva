name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard - secret scan (fails if any key or tracked .env leaks)
        run: python scripts/secret_scan.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify domain config (4 domains expected)
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from analyzer import load_domains; assert len(load_domains()) == 4, 'Expected 4 domains'"

      - name: Compile all Python files
        run: |
          python -m compileall -q src scripts tests

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short
